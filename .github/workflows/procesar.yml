name: Procesamiento

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Ingesta API-Football"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: procesamiento
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Descargar Transfermarkt
        run: |
          mkdir -p data/raw/transfermarkt
          curl -sSL -o data/raw/transfermarkt/transfermarkt-datasets.duckdb \
            https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/transfermarkt-datasets.duckdb

      - name: Recuperar API-Football
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list -w api_football.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RUN" -n api-football -D data/api_football

      - name: Vinculacion de jugadores
        run: python scripts/20_vinculacion.py

      - name: Guardar reportes
        run: |
          git config user.name "scoutvalor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reports/
          git diff --cached --quiet || (git commit -m "Actualiza reportes de procesamiento [skip ci]" && git pull --rebase -q && git push)

      - uses: actions/upload-artifact@v4
        with:
          name: procesado
          path: data/procesado
          retention-days: 90
