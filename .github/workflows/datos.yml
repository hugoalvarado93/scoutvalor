name: Pipeline de datos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/datos.yml"

permissions:
  contents: write

concurrency:
  group: pipeline-datos
  cancel-in-progress: false

jobs:
  cobertura:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar fuentes
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/01_descargar_fuentes.py

      - name: Reporte de cobertura
        run: python scripts/02_reporte_cobertura.py

      - name: Guardar reporte en el repositorio
        run: |
          git config user.name "scoutvalor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reports/
          if git diff --cached --quiet; then
            echo "Sin cambios en reportes"
          else
            git commit -m "Actualiza reporte de cobertura [skip ci]"
            git push
          fi
