name: Capturas del portal
on:
  push:
    branches: [tmp-logos]
    paths: [".github/workflows/capturas_portal.yml", "capturar.py"]
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python capturar.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add t/portal
          git commit -m "capturas del portal [skip ci]" || true
          git push
