name: Muestras de desarrollo

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Ingesta API-Football"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  muestras:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Descargar Transfermarkt
        run: |
          mkdir -p data/raw/transfermarkt
          curl -sSL -o data/raw/transfermarkt/transfermarkt-datasets.duckdb \
            https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/transfermarkt-datasets.duckdb

      - name: Recuperar API-Football
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list -w api_football.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN" ]; then gh run download "$RUN" -n api-football -D data/api_football; fi

      - name: Generar muestras
        run: python scripts/90_muestras_desarrollo.py

      - name: Publicar en rama muestras
        run: |
          git config user.name "scoutvalor-bot"
          git config user.email "actions@users.noreply.github.com"
          cp -r muestras /tmp/muestras
          git checkout --orphan muestras-nueva
          git rm -rfq .
          cp -r /tmp/muestras/. .
          echo "Muestras reducidas para desarrollo. Se regeneran automaticamente." > README.md
          git add -A
          git commit -qm "Muestras de desarrollo $(date -u +%F)"
          git push -f origin muestras-nueva:muestras
