name: Analisis academico (complementos)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/academico_complementos.yml"
      - "scripts/academico/a33_complementos.py"
  workflow_dispatch:
    inputs:
      run_api:
        description: "Corrida de Ingesta API-Football (datos del reporte del 4 nov)"
        default: "41428190475"
      run_procesado:
        description: "Corrida de Procesamiento (datos del reporte del 4 nov)"
        default: "41755740470"

permissions:
  contents: write
  actions: read

jobs:
  complementos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt matplotlib scipy

      - name: Descargar Transfermarkt
        run: |
          mkdir -p data/raw/transfermarkt
          curl -sSL -o data/raw/transfermarkt/transfermarkt-datasets.duckdb \
            https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/transfermarkt-datasets.duckdb

      - name: Recuperar los mismos datos del reporte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_api || '41428190475' }}" -n api-football -D data/api_football
          gh run download "${{ inputs.run_procesado || '41755740470' }}" -n procesado -D data/procesado
          mkdir -p data/reports/academico

      - name: Complementos - a33_complementos.py
        working-directory: scripts/academico
        run: python -u a33_complementos.py 2>&1 | tee ../../data/reports/academico/a33_complementos.txt

      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "scoutvalor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reports/academico/a33_complementos.txt
          git diff --cached --quiet || (git commit -m "Complementos del analisis academico [skip ci]" && git pull --rebase -q && git push)
