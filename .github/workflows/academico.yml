name: Analisis academico

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/academico/**"
      - ".github/workflows/academico.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: academico
  cancel-in-progress: true

jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt matplotlib scipy

      - name: Descargar Transfermarkt
        run: |
          mkdir -p data/raw/transfermarkt
          curl -sSL -o data/raw/transfermarkt/transfermarkt-datasets.duckdb \
            https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/transfermarkt-datasets.duckdb

      - name: Recuperar API-Football y datos procesados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list -w api_football.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RUN" -n api-football -D data/api_football
          RUN=$(gh run list -w procesar.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RUN" -n procesado -D data/procesado
          ls -la data/procesado

      - name: Preparar carpeta de resultados
        run: mkdir -p data/reports/academico

      - name: Actividad 1.2 - a12_requerimientos.py
        if: always()
        working-directory: scripts/academico
        run: python -u a12_requerimientos.py 2>&1 | tee ../../data/reports/academico/a12_requerimientos.txt

      - name: Actividad 2.1 - a21_preparacion.py
        if: always()
        working-directory: scripts/academico
        run: python -u a21_preparacion.py 2>&1 | tee ../../data/reports/academico/a21_preparacion.txt

      - name: Actividad 2.2 - a22_seleccion.py
        if: always()
        working-directory: scripts/academico
        run: python -u a22_seleccion.py 2>&1 | tee ../../data/reports/academico/a22_seleccion.txt

      - name: Actividad 2.3 - a23_validacion.py
        if: always()
        working-directory: scripts/academico
        run: python -u a23_validacion.py 2>&1 | tee ../../data/reports/academico/a23_validacion.txt

      - name: Actividad 3.1 - a31_evaluacion.py
        if: always()
        working-directory: scripts/academico
        run: python -u a31_evaluacion.py 2>&1 | tee ../../data/reports/academico/a31_evaluacion.txt

      - name: Actividad 3.2 - a32_resultados.py
        if: always()
        working-directory: scripts/academico
        run: python -u a32_resultados.py 2>&1 | tee ../../data/reports/academico/a32_resultados.txt

      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "scoutvalor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reports/academico/
          git diff --cached --quiet || (git commit -m "Resultados del analisis academico [skip ci]" && git pull --rebase -q && git push)
